# m1 series (2026-07-17): Table-1(new) protocol — T=3, questions_per_cat=all (560 q), mnt=512, B=1.
# Derived from t1_qwen3_ours.yaml (method definition unchanged).
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args:
    M: 32
    K: 16
    draft_top_k: 8
    record_history: false
cluster:
  name: hybrid
  alpha: 0.75
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 3
  questions_per_cat: all
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: m1_ours
  dir: output/m1_ours
