# Table 1 — Qwen3 Speed row(hooper2025speed 的 early-exit 適配:draft 只跑
# 前 6/48 層 = 12.5% expert memory(depth 軸 prune,對照 SpecMoE 的 width 軸
# 16/128),其餘層 draft 相位 identity-skip,final norm + lm_head 出 draft
# token;training-free——原文的 weighted-loss finetune 不能動 target 故不做)。
# Benchmark 協議 = t1 系列:T=5, qpc=15, mnt=512, humaneval on,
# mt_bench_pooled on.
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: speed
  args: {num_layers: 6}
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output: {label: t1_qwen3_speed, dir: output/t1_qwen3_speed}
