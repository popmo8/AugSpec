# hf-backend smoke for the md1 (DeepSeek Table-1) run - qpc=1, mnt=64.
# Prune/Draft&Verify: auto mode - resolves round(12.5% x 27 MoE layers)=3
# and reads output/draft_verify/deepseek-moe-16b-base_L3.json (BO search via
# scripts/run_search_dv.sh; missing file would trigger the in-run search).
model:
  id: deepseek-ai/deepseek-moe-16b-base
  dtype: bfloat16
  device_map: auto
draft:
  name: draft_verify
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: md1_smoke_dv
  dir: output/md1_smoke_dv
