# f15 最終驗收 r1 — SpecMoE 對照(最優化:pin + evict-on-full 內建 +
# early_pin=1,舊 q15_specmoe_r* 漏了 early_pin)。協議與 f15_hybrid 相同。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: specmoe
  args: {N: 16, route_top_k: 8, pin: true}
  early_pin: 1
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  skip_categories: [mt_bench]
output: {label: f15_specmoe_ep1_r1, dir: output/f15_specmoe_ep1_r1}
