# C1 smoke — cache mode 啟動軸(within_weight: uniform 是 content-key 前提)。
# qpc=1 / mnt=64 / skip mt_bench:liveness + merged_cache/singleton_verify_hit
# telemetry 出現即可,非 AccR run。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
draft:
  name: topm_count
  args: {M: 32, K: 16, draft_top_k: 8, record_history: false}
cluster:
  name: freq_slice
  within_weight: uniform
run:
  T: 5
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  skip_categories: [mt_bench]
output: {label: c1_smoke, dir: output/c1_smoke}
