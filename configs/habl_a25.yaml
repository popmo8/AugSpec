# hybrid alpha ablation (2026-07-25): alpha=0.25, 其餘 = t1_qwen3_ours 完整協議
# (T=5, qpc=15, mnt=512, humaneval+mt_bench_pooled, B=1)。
# 舊版 ablation (q15_hybrid_*, 2026-07-04) 是無 mt_bench/humaneval 協議。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args:
    M: 32
    K: 16
    draft_top_k: 8
    record_history: false
cluster:
  name: hybrid
  alpha: 0.25
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: habl_a25
  dir: output/habl_a25
