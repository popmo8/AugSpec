# hf-backend smoke for the dsm run (first-ever deepseek-family run) - qpc=1, mnt=64.
# Ours: topm_count M16/K8 (M=2K convention), hybrid a75 — same method
# definition as m1_ours; hf act-sim prefill capture lives in the deepseek
# adapter's verify expert loop (check the [act_sim] engage line in the log).
model:
  id: deepseek-ai/deepseek-moe-16b-base
  dtype: bfloat16
  device_map: auto
draft:
  name: topm_count
  args:
    M: 16
    K: 8
    draft_top_k: 6
    record_history: false
cluster:
  name: hybrid
  alpha: 0.75
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: dsm_smoke_base_ours
  dir: output/dsm_smoke_base_ours
