# hf-backend smoke for the mx1 (Mixtral Table-1) run — qpc=1, mnt=64.
# Prune/Speed: early-exit draft runs the first 4/32 decoder layers = 12.5%.
model:
  id: mistralai/Mixtral-8x7B-v0.1
  dtype: bfloat16
  device_map: auto
draft:
  name: speed
  args:
    num_layers: 4
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: mx1_smoke_speed
  dir: output/mx1_smoke_speed
