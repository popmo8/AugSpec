# KV-clone smoke (2026-07-22 OOM fix): ast = clone of stacked tgt (was
# per-seq deepcopy+stack). AccR 崩到 ~0.01 = ast KV 壞掉(已知簽名);正常 ~0.3-0.7。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args:
    M: 32
    K: 16
    draft_top_k: 8
    record_history: false
cluster:
  name: hybrid
  alpha: 0.75
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 5
  questions_per_cat: 1
  max_new_tokens: 32
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
  batch_loop: true
  batch_size: 4
  batch_by_category: true
output:
  label: smoke_kvclone
  dir: output/smoke_kvclone
