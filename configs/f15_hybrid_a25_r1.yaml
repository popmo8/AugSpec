# f15 最終驗收 r1 — topm/hybrid alpha=0.25(cache mode + C3 pipeline)。
# 協議:C-BOOT on、B variant 分群、merge_overlap pipeline;與 f15_specmoe 同
# vram_budget_ratio/T/qpc/mnt。與舊 q15_*(pre-C-BOOT)不可直接比。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args: {M: 32, K: 16, draft_top_k: 8, record_history: false}
cluster:
  name: hybrid
  alpha: 0.25
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  skip_categories: [mt_bench]
output: {label: f15_hybrid_a25_r1, dir: output/f15_hybrid_a25_r1}
