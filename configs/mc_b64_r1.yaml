# batch sweep — MoE-Caching (non-speculative, draft:none) at B=64.
# Same protocol as V3/V4 (qpc15/mnt512/humaneval/pooled) for the 3-way crossover.
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: none
run:
  questions_per_cat: 15
  max_new_tokens: 512
  humaneval: true
  mt_bench_pooled: true
  batch_loop: true
  batch_size: 64
output: {label: mc_b64_r1, dir: output/mc_b64_r1}
