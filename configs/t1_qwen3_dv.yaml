# Table 1 — Qwen3 Draft&Verify row(zhang2024draftverify 的 layer-skipping
# 適配:draft 相位跳掉 BO 選出的 42/48 個 MoE sublayer,只執行 6 個 = 12.5%
# expert memory;attention 全保留(不佔 expert memory,只利多 baseline);
# verify 全層照跑。args 留空 = 自動:num_keep 由 12.5% 預算推出、spec 走
# output/draft_verify/<tag>_L6.json,檔案不在就 in-run 跑 BO search(離線
# 路線:sbatch scripts/run_search_dv.sh;目標 = C4 dev continuations 上的
# greedy token agreement)。
# Benchmark 協議 = t1 系列:T=5, qpc=15, mnt=512, humaneval on,
# mt_bench_pooled on.
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: draft_verify
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output: {label: t1_qwen3_dv, dir: output/t1_qwen3_dv}
