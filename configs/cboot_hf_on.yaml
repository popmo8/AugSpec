# C-BOOT 診斷 — hf backend(無 moe_infinity 引擎),prefill_warmup ON。
# 若 hf 也崩 → HF assisted-loop 側的同步遺漏;hf 正常 → offload 引擎互動。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: hf
  dtype: bfloat16
draft:
  name: topm_count
  args: {M: 32, K: 16, draft_top_k: 8, record_history: false}
cluster:
  name: freq_slice
  within_weight: freq
run:
  T: 5
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  skip_categories: [mt_bench]
output: {label: cboot_hf_on, dir: output/cboot_hf_on}
