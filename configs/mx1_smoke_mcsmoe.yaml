# hf-backend smoke for the mx1 (Mixtral Table-1) run — qpc=1, mnt=64.
# Merge/MC-SMoE: router-logits grouping + permutation-aligned merge,
# average K=1 (adaptive global budget 32*1 dominants).
model:
  id: mistralai/Mixtral-8x7B-v0.1
  dtype: bfloat16
  device_map: auto
draft:
  name: mc_smoe
  args:
    spec_path: output/mc_smoe/Mixtral-8x7B-v0.1_K1.json
    draft_top_k: 1
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  humaneval: true
  mt_bench_pooled: true
output:
  label: mx1_smoke_mcsmoe
  dir: output/mx1_smoke_mcsmoe
