# M sweep ablation (2026-07-25): K=16 固定, M=64 (=4K), T=10;
# 其餘 = t1_qwen3_ours (qpc=15, mnt=512, B=1)。topm_stats.json 記錄 M 飽和/丟棄。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 1.0
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args:
    M: 64
    K: 16
    draft_top_k: 8
    record_history: false
cluster:
  name: hybrid
  alpha: 0.75
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform
run:
  T: 10
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: mabl_m64
  dir: output/mabl_m64
