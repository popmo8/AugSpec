# hf-backend smoke for the mx1 (Mixtral Table-1) run — qpc=1, mnt=64.
# Prune/SpecMoE: kept-mask N=1 (8->1), native top-2 routing in both phases.
# pin/early_pin are offload-only knobs — inert on hf (mirrors m1_specmoe).
model:
  id: mistralai/Mixtral-8x7B-v0.1
  dtype: bfloat16
  device_map: auto
draft:
  name: specmoe
  args:
    N: 1
    route_top_k: 2
    pin: true
  early_pin: 1
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: mx1_smoke_specmoe
  dir: output/mx1_smoke_specmoe
