# Table 1 — Qwen3 SpecMoE row (最優化: pin + early_pin=1;
# model/draft 沿用 f15_specmoe_ep1_r1). Benchmark 協議 = t1 系列:
# T=5, qpc=15, mnt=512, humaneval on, mt_bench_pooled on.
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: specmoe
  args: {N: 16, route_top_k: 8, pin: true}
  early_pin: 1
run:
  T: 5
  questions_per_cat: 15
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output: {label: t1_qwen3_specmoe, dir: output/t1_qwen3_specmoe}
