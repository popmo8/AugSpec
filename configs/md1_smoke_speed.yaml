# hf-backend smoke for the md1 (DeepSeek Table-1) run - qpc=1, mnt=64.
# Prune/Speed: draft runs the first 4/28 decoder layers = dense layer 0 +
# MoE layers 1-3 -> 3/27 MoE layers (~11.1%, the round(12.5% x 27)=3 budget,
# matching Draft&Verify's kept count).
model:
  id: deepseek-ai/deepseek-moe-16b-base
  dtype: bfloat16
  device_map: auto
draft:
  name: speed
  args:
    num_layers: 4
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: md1_smoke_speed
  dir: output/md1_smoke_speed
