# hf-backend smoke for the md1 (DeepSeek Table-1) run - qpc=1, mnt=64.
# Merge/HC-SMoE: avg-linkage K=8 freq-weighted merge (build_hc_smoe.py on
# the B1 calibration).
model:
  id: deepseek-ai/deepseek-moe-16b-base
  dtype: bfloat16
  device_map: auto
draft:
  name: static_merge
  args:
    spec_path: output/hc_smoe/deepseek-moe-16b-base_K8.json
    draft_top_k: 6
run:
  T: 3
  questions_per_cat: 1
  max_new_tokens: 64
  humaneval: true
  mt_bench_pooled: true
output:
  label: md1_smoke_hcsmoe
  dir: output/md1_smoke_hcsmoe
