# V2 offload 統計等價驗收（batch_spec_plan.md §6）：ours_batch1
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
    merge_offload: true
    merge_during_verify: true
    merge_overlap: true
draft:
  name: topm_count
  args: {M: 32, K: 16, draft_top_k: 8, record_history: false}
cluster:
  name: hybrid
  alpha: 0.75
  metric: l2
  norm: rank
  cooccur_norm: raw
  cooccur_scope: decode
  within_weight: uniform

run:
  T: 5
  questions_per_cat: 80
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: false
  skip_categories: [mt_bench, summarization, qa, math_reasoning, rag]
  batch_loop: true
  batch_size: 64
output: {label: aff_trans_b64, dir: output/aff_trans_b64}
