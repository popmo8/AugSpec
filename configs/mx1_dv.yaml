# mx1 series (2026-07-20): Mixtral-8x7B Table-1 rows under the m1 protocol —
# T=3, questions_per_cat=all (560 q), mnt=512, B=1, HF BACKEND ONLY
# (Mixtral has no offload port, baseline_tables_plan.md S3).
# Budget: 12.5% of 8 experts -> 1 draft-side expert per layer (8->1).
# Prune/Draft&Verify: auto mode — resolves 12.5% budget (4/32 MoE sublayers)
# and reads output/draft_verify/Mixtral-8x7B-v0.1_L4.json (BO search via
# scripts/run_search_dv.sh; missing file would trigger the in-run search).
model:
  id: mistralai/Mixtral-8x7B-v0.1
  dtype: bfloat16
  device_map: auto
draft:
  name: draft_verify
run:
  T: 3
  questions_per_cat: all
  max_new_tokens: 512
  prefill_warmup: true
  humaneval: true
  mt_bench_pooled: true
output:
  label: mx1_dv
  dir: output/mx1_dv
