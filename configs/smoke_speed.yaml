# SPEED smoke — early-exit draft(draft 相位只跑前 6/48 層,其餘 42 層
# identity-skip,final norm + lm_head 直接出 draft token)。offload 端到端
# liveness:qpc=1 / mnt=64 / skip mt_bench,非 AccR run。
model:
  id: Qwen/Qwen3-30B-A3B-Base
  backend: offload
  dtype: bfloat16
  offload:
    path: /work/morrisliu07/aug_spec/moe_infinity/offload_output/Qwen3-30B-A3B-Base
    vram_budget_ratio: 0.2
draft:
  name: speed
  args: {num_layers: 6}
run:
  T: 5
  questions_per_cat: 1
  max_new_tokens: 64
  prefill_warmup: true
  skip_categories: [mt_bench]
output: {label: smoke_speed, dir: output/smoke_speed}
